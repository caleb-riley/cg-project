<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Linear Programming Visualizer</title>
</head>

<body style="padding: 10px;">
    <div class="vlist">
        <div class="rounded-outline vlist" style="align-items: center;">
            <h1 style="text-align: center;">Linear Programming Visualizer</h1>
            <p style="text-align: center;">CSCI 716 - Computational Geometry</p>
            <p>Caleb Riley (<a href="mailto:car1915@rit.edu">car1915@rit.edu</a>)</p>
        </div>

        <div class="rounded-outline vlist">
            <h2># Description</h2>

            <div id="description-container" class="vlist"></div>
        </div>

        <div class="rounded-outline vlist">
            <h2># Interactive Aid</h2>

            <p style="color: yellow;">Work in progress, play with this counter in the meantime (saves!)</p>

            <div class="hlist" style="align-items: center;">
                <button id="increment-button" style="background-color: green;">Increment</button>
                <button id="decrement-button" style="background-color: maroon;">Decrement</button>
                <button id="reset-button" style="background-color: gray;">Reset</button>

                <p id="counter-label">Counter: 0</p>
            </div>

            <p>Objective function:</p>

            <input id="objective-function" type="text" placeholder="Enter objective">

            <p>Constraints:</p>

            <div class="vlist">
                <div id="constraint-container" class="vlist" style="display: none;"></div>

                <div class="hlist">
                    <button id="add-constraint" style="background-color: green;">Add constraint</button>
                    <button id="solve-system" style="background-color: blue;">Solve system</button>
                </div>
            </div>
        </div>

        <div class="rounded-outline vlist">
            <h2># References</h2>

            <ul id="reference-container" class="vlist"></ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
